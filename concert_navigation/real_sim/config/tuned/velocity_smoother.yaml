# TUNED config set — UNCHANGED copy of velocity_smoother.yaml. NOTE: with the
# tuned collision_monitor (cmd_vel_in_topic: cmd_vel_smoothed) this node is now
# ACTUALLY in the command chain. Its deadband [0.05,0.05,0.05] now applies — if
# your base needs a larger rotational deadband, align the 3rd value here with it.
# See NAV2_TUNING.md §3.
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    enable_stamped_cmd_vel: false
    feedback: "CLOSED_LOOP"
    max_velocity: [0.8, 0.5, 1.2]
    min_velocity: [-0.35, -0.5, -1.2]
    max_accel: [2.5, 2.0, 1.6]
    max_decel: [-2.5, -2.0, -1.6]
    odom_topic: "/base_link/odom"
    odom_duration: 0.1
    deadband_velocity: [0.05, 0.05, 0.5]
    velocity_timeout: 1.0

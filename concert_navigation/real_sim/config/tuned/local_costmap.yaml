# =============================================================================
# TUNED COPY for simulation.
# The controller/planner behavior is from the tuned real profile. Keep the tuned
# real footprint here too, so simulation validates the same clearance envelope.
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link_projected
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[ [-0.625, -0.4], [-0.625, 0.4], [0.625, 0.4], [0.625, -0.4] ]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0
        inflation_radius: 0.80
      # 2D ObstacleLayer (parity with global_costmap). The old VoxelLayer discarded
      # every scan point: the merged /scan plane sits at z = -0.063 m in the odom
      # frame (lidar is ~0.063 m below base_link, and odom is coincident with
      # base_link), which is below the voxel grid floor origin_z=0.0.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # LAYER-level height gate for the MARKING loop — SEPARATE from the per-source
        # filter under scan: below (which only feeds the observation buffer). Default is
        # 0.0, which silently rejects our scan plane at z=-0.063 (points get buffered but
        # never marked, with NO error). Verified live: raising this to negative made the
        # costmap mark (86 lethal + 2889 inflated cells). Both filters must be negative.
        min_obstacle_height: -0.3
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          # Height filter is applied in the costmap (odom) frame, and the scan plane
          # is at z=-0.063, so the default min_obstacle_height=0.0 would discard all
          # of /scan. Widen the window to include the (slightly sub-origin) scan.
          min_obstacle_height: -0.3
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

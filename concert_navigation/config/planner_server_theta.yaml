planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      # Theta* is any-angle, so in open free space it can produce straight
      # line-segment paths instead of the grid stair-step shape from Smac2D.
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: true
      terminal_checking_interval: 5000
      use_final_approach_orientation: false

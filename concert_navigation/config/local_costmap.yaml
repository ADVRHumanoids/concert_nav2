local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link_projected
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[ [-0.685, -0.4], [-0.685, 0.4], [0.685, 0.4], [0.685, -0.4] ]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0
        inflation_radius: 0.85
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # The merged LaserScan can sit slightly below the odom z=0 plane in
        # both sim and the real robot. Keep the layer and source height gates
        # open below zero so valid scan points are not silently discarded.
        min_obstacle_height: -0.3
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: -0.3
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True
